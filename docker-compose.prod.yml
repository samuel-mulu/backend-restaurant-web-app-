# Isolated 3T Juice House production stack.
# Do not attach this file to any existing Compose project, network, or volume.
#
# Interpolated ${VARS} come from `.env` in this directory, or:
#   docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# This file never publishes Mongo 27017 and never joins external networks.

name: 3t-juice-house

services:
  mongo:
    image: mongo:7.0
    container_name: 3t-juice-house-mongo
    hostname: 3t-juice-house-mongo
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-3t_juice_house}
      MONGO_REPLICA_HOST: ${MONGO_REPLICA_HOST:-3t-juice-house-mongo:27017}
      MONGO_KEYFILE_PATH: /mongo-keyfile/mongo-keyfile
    entrypoint:
      [
        "/bin/bash",
        "-c",
        "sed -i 's/\\r$//' /mongo-entrypoint.sh && exec /bin/bash /mongo-entrypoint.sh",
      ]
    volumes:
      - 3t_juice_house_mongo_data:/data/db
      - 3t_juice_house_mongo_keyfile:/mongo-keyfile
      - ./docker/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro
    networks:
      3t_juice_house_internal:
    expose:
      - "27017"
    # Mongo is internal-only. Do not add a host `ports:` mapping.
    mem_limit: 1g
    cpus: 0.75
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh -u \"$$MONGO_ROOT_USERNAME\" -p \"$$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --quiet --eval 'quit((db.hello().isWritablePrimary || db.hello().ismaster) ? 0 : 1)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: 3t-juice-house-api:prod
    container_name: 3t-juice-house-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@3t-juice-house-mongo:27017/${MONGO_APP_DATABASE:-3t_juice_house}?authSource=${MONGO_APP_DATABASE:-3t_juice_house}&replicaSet=rs0&retryWrites=true&w=majority
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5200:5000"
    networks:
      3t_juice_house_internal:
    mem_limit: 512m
    cpus: 0.50
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  3t_juice_house_internal:
    name: 3t_juice_house_internal
    driver: bridge
    internal: false

volumes:
  3t_juice_house_mongo_data:
    name: 3t_juice_house_mongo_data
  3t_juice_house_mongo_keyfile:
    name: 3t_juice_house_mongo_keyfile
